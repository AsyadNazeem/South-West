<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8"/>
    <script>
        // Resolve the current storefront theme before Vue renders.
        (() => {
            const root = document.documentElement
            const controller = new AbortController()

            root.setAttribute('data-theme-pending', '')

            // Fail open if the application bundle cannot initialize.
            window.__websiteThemeRevealTimer = setTimeout(() => {
                root.removeAttribute('data-theme-pending')
            }, 5000)

            const timeout = setTimeout(() => {
                controller.abort()
            }, 3000)

            window.__websiteThemePromise = Promise.resolve()
                .then(() => {
                    const apiUrl = '%VITE_API_URL%'.replace(/\/$/, '')
                    return fetch(apiUrl + '/store/website-theme/active', {
                        cache: 'no-store',
                        credentials: 'omit',
                        signal: controller.signal
                    })
                })
                .then(response => {
                    if (!response.ok) {
                        throw new Error('Theme request failed')
                    }

                    return response.json()
                })
                .then(payload => {
                    if (!payload || !Object.prototype.hasOwnProperty.call(payload, 'data')) {
                        throw new Error('Invalid theme response')
                    }

                    const theme = payload.data

                    if (theme !== null && (
                        typeof theme !== 'object' ||
                        Array.isArray(theme) ||
                        typeof theme.slug !== 'string'
                    )) {
                        throw new Error('Invalid theme configuration')
                    }

                    return { ok: true, theme }
                })
                .catch(() => ({ ok: false, theme: null }))
                .finally(() => clearTimeout(timeout))
        })()
    </script>
    <style>
        html[data-theme-pending] #app {
            visibility: hidden;
        }
    </style>

    <link rel="icon" type="image/png" href="/Favicon.png"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <meta name="description" content="Shop products by category and brand at South West, Sri Lanka."/>
    <meta name="robots" content="index, follow"/>
    <link rel="canonical" href="https://southwest.lk/"/>
    <meta property="og:site_name" content="South West"/>
    <meta property="og:title" content="South West | Online shopping in Sri Lanka"/>
    <meta property="og:description" content="Shop products by category and brand at South West, Sri Lanka."/>
    <meta property="og:url" content="https://southwest.lk/"/>
    <meta property="og:image" content="https://southwest.lk/SWShareImage.png"/>
    <meta property="og:type" content="website"/>
    <meta name="twitter:card" content="summary_large_image"/>
    <script>
        // Discover the first active promotion before the homepage bundle loads.
        if (location.pathname === '/' && !location.search) {
            const apiUrl = '%VITE_API_URL%'.replace(/\/$/, '')
            const apiOrigin = new URL(apiUrl, location.href).origin
            const connectionHint = document.createElement('link')
            connectionHint.rel = 'preconnect'
            connectionHint.href = apiOrigin
            connectionHint.crossOrigin = 'anonymous'
            document.head.appendChild(connectionHint)

            function resolveBannerUrl(value) {
                if (typeof value !== 'string' || !value.trim()) return ''
                const raw = value.trim()
                if (/^(https?:|blob:|data:)/i.test(raw)) return raw
                if (raw.startsWith('//')) return location.protocol + raw
                const normalized = raw.replace(/\\/g, '/').replace(/^\/+/, '')
                const uploadPath = normalized.startsWith('uploads/')
                    ? normalized
                    : 'uploads/' + normalized
                return new URL('/' + uploadPath, apiOrigin).href
            }

            window.__homepageBannersPromise = fetch(apiUrl + '/store/homepage-banners')
                .then(response => {
                    if (!response.ok) throw new Error('Banner request failed')
                    return response.json()
                })
                .then(payload => {
                    const banners = Array.isArray(payload.data)
                        ? payload.data.filter(banner => banner.image_url)
                        : []
                    const first = banners[0]
                    if (first) {
                        const mobile = window.matchMedia('(max-width: 650px)').matches
                        const candidates = mobile && first.mobile_image_url
                            ? first.mobile_responsive_images
                            : first.responsive_images
                        const fallback = mobile && first.mobile_image_url
                            ? first.mobile_image_url
                            : first.image_url
                        const preload = document.createElement('link')
                        preload.rel = 'preload'
                        preload.as = 'image'
                        preload.fetchPriority = 'high'
                        preload.href = resolveBannerUrl(fallback)
                        const byWidth = new Map()
                        if (Array.isArray(candidates)) {
                            for (const candidate of candidates) {
                                const width = candidate?.width
                                if (!Number.isSafeInteger(width) || width <= 0) continue
                                const url = resolveBannerUrl(candidate?.url)
                                if (!url || byWidth.has(width)) continue
                                byWidth.set(width, url)
                            }
                        }
                        if (byWidth.size) {
                            preload.imageSrcset = [...byWidth.entries()]
                                .sort(([left], [right]) => left - right)
                                .map(([width, url]) => `${url} ${width}w`)
                                .join(', ')
                            preload.imageSizes = '(min-width: 1532px) 1440px, 94vw'
                        }
                        if (preload.href) document.head.appendChild(preload)
                    }
                    return banners
                })
                .catch(error => {
                    console.warn('Early banner discovery failed:', error)
                    return null
                })
        }
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600..800&family=Manrope:wght@400;500;600;700;800&display=optional" rel="stylesheet" media="print" onload="this.media='all'">
    <title>South West | Online shopping in Sri Lanka</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
<div id="app"></div>
<script type="module" src="/src/main.js"></script>
</body>
</html>
