deployment:
  tasks:
    - /bin/bash -c 'source /home/southwes/nodevenv/southwest-backend/22/bin/activate && cd /home/southwes/southwest-repo/Frontend/Customer && npm ci --include=dev && npm run build'
    - /bin/bash -c 'source /home/southwes/nodevenv/southwest-backend/22/bin/activate && cd /home/southwes/southwest-repo/Frontend/Admin && npm ci --include=dev && npm run build'
